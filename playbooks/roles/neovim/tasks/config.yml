---
- name: Check custom neovim repo availability
  ansible.builtin.uri:
    url: "{{ my_neovim_repo }}"
    method: GET
  register: my_neovim_repo_status
  ignore_errors: true
  tags: [config]

- name: Fail if neovim repo is unreachable
  ansible.builtin.fail:
    msg: "Neovim repo {{ my_neovim_repo }} is unreachable (status: {{ my_neovim_repo_status.status | default('no response') }})"
  when: my_neovim_repo_status is failed
  tags: [config]

- name: Deploy custom neovim configurations from git repo
  ansible.builtin.git:
    repo: "{{ my_neovim_repo }}"
    dest: "{{ nvim_config_dir }}/nvim"
    version: main
    update: true
    force: true
  when: my_neovim_repo_status is not failed
  tags: [config]

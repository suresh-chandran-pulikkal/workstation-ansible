---
- name: Install starship shell prompt
  ansible.builtin.package:
    name: starship
    state: present
  become: true
  become_flags: '-E'
  tags: [config]

- name: Check if fish config exists
  ansible.builtin.stat:
    path: "{{ fish_config_dir }}"
  register: fish_config_status
  changed_when: false
  tags: [config]

- name: Backup existing fish config if enabled and exists
  tags: [config]
  block:
    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ fish_config_dir }}.bak"
        state: directory
        mode: '0755'
    - name: Copy existing config to backup
      become: true
      ansible.posix.synchronize:
        src: "{{ fish_config_dir }}/"
        dest: "{{ fish_config_dir }}.bak/"
        recursive: true
        owner: true
    - name: Remove existing fish directory
      ansible.builtin.file:
        path: "{{ fish_config_dir }}"
        state: absent
  when:
    - backup_fish | default(true) | bool
    - fish_config_status.stat.exists
  rescue:
    - name: Backup failed warning
      ansible.builtin.debug:
        msg: "fish config backup failed, continuing with installation"
      changed_when: false

- name: Deploy customised-fish config files from git
  ansible.builtin.git:
    repo: "{{ fish_config_repo }}"
    dest: "{{ fish_config_dir }}"
    force: true
    update: true
  tags: [config]

# Configure starship
- name: Create symbolic link for starship config file
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
    owner: "{{ starship_user }}"
    group: "{{ starship_group }}"
  loop:
    - { src: "{{ src.starship_conf }}", dest: "{{ dest.starship_conf }}" }
  tags: [config]

- name: Set fish as default shell
  ansible.builtin.user:
    name: "{{ starship_user }}"
    shell: /usr/bin/fish
  become: true
  notify: shell changed
  tags: [config]

---
- name: Install starship shell promt
  ansible.builtin.package:
    name: starship
    state: present
    force: yes
  become: yes
  become_flags: '-E'
  #ansible.builtin.shell: |
  #  curl -sS https://starship.rs/install.sh | sh -s -- --yes

- name: Check if fish config exists
  ansible.builtin.stat:
    path: "{{ fish_config_dir }}"
  register: fish_config_status
  changed_when: false

- name: Backup existing fish config if enabled and exists
  block:
    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ fish_config_dir }}.bak"
        state: directory
        mode: '0755'
    - name: Copy existing config to backup
      become: true
      synchronize:
        src: "{{ fish_config_dir }}/"
        dest: "{{ fish_config_dir }}.bak/"
        recursive: true
        owner: true
    - name: Remove existing fish directory
      ansible.builtin.file:
        path: "{{ fish_config_dir }}"
        state: absent
  when:
    - backup_fish | default(true) | bool
    - fish_config_status.stat.exists
  rescue:
    - name: Backup failed warning
      ansible.builtin.debug:
        msg: "fish config backup failed, continuing with installation"
      changed_when: false

- name: Deploy customised-fish config files from git
  git:
    repo: "{{ fish_config_repo }}"
    dest: "{{ fish_config_dir }}"
    force: true
    update: true

# Configure starship
- name: Create symbolic link for starship config file
  file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: yes
    owner: "{{ starship_user }}"
    group: "{{ starship_group }}"
  with_items:
    - { src: "{{ src.starship_conf }}", dest: "{{ dest.starship_conf }}" }

    # - name: Add starship init to Fish config

# - name: Set fish as default shell
#   ansible.builtin.user:
#     name: "{{ starship_user }}"
#     shell: /usr/bin/fish
#     append: yes
#

- name: Set fish as default shell
  ansible.builtin.shell: chsh -s /usr/bin/fish {{ starship_user }}
  become: true

- name: Restart shell session
  ansible.builtin.shell: "exec fish"
  when: true
